<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Bag Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300;1,9..144,400&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2ede5; --bg2:#e9e2d7; --ink:#201915; --muted:#766b63; --line:#d6cbbd; --card:#fbf9f5;
  --accent:#4a1f1f; --accent-ink:#f8f3ec; --soft:#e6dccf; --gold:#b48a5a; --ok:#3f6b4f; --shadow:rgba(40,25,15,.22); --photo:#ffffff;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#171311; --bg2:#1f1915; --ink:#f0e8df; --muted:#a69a8f; --line:#3b322c; --card:#221c18;
  --accent:#e2c2b2; --accent-ink:#1b1512; --soft:#2c2420; --gold:#caa072; --ok:#8dbf9c; --shadow:rgba(0,0,0,.5); --photo:#f4f0ea; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#171311; --bg2:#1f1915; --ink:#f0e8df; --muted:#a69a8f; --line:#3b322c; --card:#221c18;
  --accent:#e2c2b2; --accent-ink:#1b1512; --soft:#2c2420; --gold:#caa072; --ok:#8dbf9c; --shadow:rgba(0,0,0,.5); --photo:#f4f0ea; color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Karla,"Helvetica Neue",Arial,sans-serif;font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.wrap{max-width:720px;margin:0 auto;padding:22px 16px 120px}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:300;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(38px,10vw,56px);line-height:1}
h2{font-size:clamp(24px,6vw,32px);line-height:1.1}
h3{font-size:22px;font-weight:500;line-height:1.15}
em{font-style:italic;font-weight:300}
p{margin:0}
.muted{color:var(--muted)}
.tiny{font-size:13px;color:var(--muted)}
.count{font-family:Fraunces,serif;font-size:15px;color:var(--muted);margin-bottom:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:999px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600;font-size:15px;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.small{min-height:38px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.seg button:focus-visible,.sw:focus-visible,.dot:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--card)}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;font-size:14px;padding:8px 14px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.brief{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin:0 0 18px}
.brief summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
.brief summary::-webkit-details-marker{display:none}
.brief summary::after{content:"+";font-family:Fraunces,serif;font-size:22px;color:var(--muted)}
.brief[open] summary::after{content:"–"}
.brief p{margin-top:10px;font-size:15px;white-space:pre-wrap}
.brief textarea{margin-top:10px}

/* stage */
.stage{position:relative;height:min(62vh,540px);perspective:1300px;touch-action:pan-y;user-select:none;-webkit-user-select:none;margin:0 -16px}
.cardw{position:absolute;left:50%;top:50%;width:min(76vw,330px);height:min(58vh,500px);margin:calc(min(58vh,500px) / -2) 0 0 calc(min(76vw,330px) / -2);transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .35s;will-change:transform;cursor:pointer}
.stage.dragging .cardw{transition:none}
.card3d{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.2,.8,.2,1)}
.cardw.on .card3d{animation:float 5s ease-in-out infinite}
.cardw.on.flipped .card3d{transform:rotateY(180deg);animation:none}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.cardw.on .card3d{animation:none}.cardw,.card3d{transition:none}}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;background:var(--card);border:1px solid var(--line);box-shadow:0 30px 60px -20px var(--shadow);padding:14px 14px 18px;display:flex;flex-direction:column;overflow:hidden}
.face.back{transform:rotateY(180deg);padding:20px}
.photo{flex:1;min-height:0;border-radius:18px;background:var(--photo);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.photo img{width:100%;height:100%;object-fit:contain;display:block;-webkit-user-drag:none;pointer-events:none}
.photo .sil{width:60%;height:auto;filter:drop-shadow(0 18px 20px var(--shadow))}
.photo .out{position:absolute;left:10px;top:10px;background:rgba(32,25,21,.8);color:#f8f3ec;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:4px 9px;border-radius:999px}
.face .meta{padding:12px 6px 0}
.face .brand{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.face .nm{font-family:Fraunces,serif;font-size:21px;font-weight:500;line-height:1.1;margin-top:2px}
.face .nm small{display:block;font-family:Karla,sans-serif;font-size:14px;font-weight:400;color:var(--muted);margin-top:3px}
.face .pr{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px}
.face .price{font-family:Fraunces,serif;font-size:21px;font-weight:500}
.face .price small{font-family:Karla,sans-serif;font-size:12px;color:var(--muted);font-weight:400;margin-left:5px}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--soft);font-size:12px;font-weight:600;white-space:nowrap}
.dotc{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.dotc i{width:14px;height:14px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.15)}
.face.back .k{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-top:11px}
.face.back .v{font-size:15px;line-height:1.35}
.face.back .flipnote{margin-top:auto;font-size:12px;color:var(--muted);padding-top:10px}
.stagebar{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 16px}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:60vw}
.dot{width:8px;height:8px;border-radius:50%;border:0;background:var(--line);padding:0;cursor:pointer}
.dot.on{background:var(--gold);width:22px;border-radius:4px}
.arrow{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;cursor:pointer}
.arrow:disabled{opacity:.3}
.hintline{text-align:center;font-size:13px;color:var(--muted);margin:-8px 0 14px}

/* panel */
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.panel h3{margin-bottom:2px}
.colors{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.sw{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:7px 12px 7px 7px;background:transparent;color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.sw i{width:22px;height:22px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.15)}
.sw.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.sw.out{opacity:.55}
.sw small{color:var(--muted)}
.sizebar{margin:16px 0 2px}
.sizebar .lab{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);gap:10px}
.sizebar .t{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;margin-top:4px}
.sizebar .t i{display:block;height:100%;background:var(--gold)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin:14px 0 4px;font-size:15px}
.facts b{display:block;font-weight:600;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.fits{margin-top:10px;font-size:14px}
.fits span{display:inline-block;background:var(--soft);border-radius:8px;padding:4px 10px;margin:4px 6px 0 0}
.sec{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.sec .h{font-weight:600;display:flex;justify-content:space-between;align-items:center}
.sec ul{margin:8px 0 0;padding-left:18px;font-size:15px}
.sec li{margin:6px 0}
.rev{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:14px;margin-top:8px;text-decoration:none;color:var(--ink)}
.rev b{display:block;font-weight:600;font-size:15px}
.rev span{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.rev small{display:inline-block;font-size:12px;color:var(--gold);font-weight:600;margin-top:4px}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--soft);font-size:13px;font-weight:600;margin-left:6px}

/* forms */
input[type=text],input[type=number],input[type=url],textarea,select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
textarea{min-height:88px;resize:vertical}
.f{display:grid;gap:4px;margin-top:12px}
.f label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.f .h{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}

/* rank */
.rk{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.rk:first-child{border-top:0}
.rk .n{font-family:Fraunces,serif;font-size:28px;font-weight:300;color:var(--muted)}
.rk .th{width:48px;height:48px;border-radius:10px;background:var(--photo);object-fit:contain;float:left;margin:0 10px 4px 0}
.rk .ar{display:flex;gap:4px}
.rk .ar button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;cursor:pointer}
.rk .ar button:disabled{opacity:.3}
.yn{display:inline-flex;gap:6px;margin-top:6px}
.yn button{border:1px solid var(--line);background:transparent;color:var(--ink);padding:5px 12px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer}
.yn button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.rk input[type=text]{margin-top:8px;font-size:14px;padding:8px 11px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.hide{display:none !important}
@media (min-width:720px){.stage{margin:0}}
</style>
</head>
<body>
<div class="wrap">

<div class="top">
  <div>
    <p class="count" id="count">The shortlist</p>
    <h1>The <em>lineup.</em></h1>
  </div>
  <div class="seg" id="modes">
    <button data-mode="view" class="on">Look</button>
    <button data-mode="edit">Edit</button>
    <button data-mode="rank">Rank</button>
  </div>
</div>

<details class="brief" id="brief">
  <summary>What Maggie told us</summary>
  <p id="brieftext"></p>
  <textarea id="briefedit" class="hide" placeholder="Notes from the questionnaire"></textarea>
</details>

<div class="stage" id="stage"></div>
<div class="stagebar">
  <button class="arrow" id="prev" aria-label="Previous bag">←</button>
  <div class="dots" id="dots"></div>
  <button class="arrow" id="next" aria-label="Next bag">→</button>
</div>
<p class="hintline" id="stagehint">Swipe to turn the lineup. Tap the bag to flip it.</p>

<div class="panel" id="panel"></div>

<div class="row" id="sharerow">
  <button class="btn ghost" id="copylink">Copy link to this lineup</button>
  <a class="btn ghost" id="studylink" href="./">Back to the questionnaire</a>
</div>
<p class="tiny" style="margin-top:14px">Photos come from each brand's product page (Purple via Lyst). Reviews link to the writers who tested the bags.</p>

</div>
<div class="toast" id="toast"></div>

const variants = () => S.bags.flatMap(b => b.colors.map(c => ({vid: b.id + ":" + slug(c.name), b, c})));

function normalize(){
  S.bags = (S.bags||[]).filter(b => b && b.id);

  const vids = variants().map(v=>v.vid);

const b64u = { enc: bytes => btoa(String.fromCharCode(...bytes)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""), dec: s => Uint8Array.from(atob(s.replace(/-/g,"+").replace(/_/g,"/")), c=>c.charCodeAt(0)) };
async function encodeState(){
  const json = JSON.stringify({bags:S.bags, order:S.order, tuesday:S.tuesday, notes:S.notes, brief:S.brief, by:S.by});
  const raw = new TextEncoder().encode(json);
  if(typeof CompressionStream === "function"){
    try{ const cs = new CompressionStream("deflate-raw"); const w = cs.writable.getWriter(); w.write(raw); w.close();
      const buf = await new Response(cs.readable).arrayBuffer(); return "z." + b64u.enc(new Uint8Array(buf)); }catch(e){}
  }
  return "j." + b64u.enc(raw);
}
async function decodeState(s){
  const kind = s.slice(0,2), body = s.slice(2); let bytes = b64u.dec(body);
  if(kind==="z."){ const ds = new DecompressionStream("deflate-raw"); const w = ds.writable.getWriter(); w.write(bytes); w.close(); bytes = new Uint8Array(await new Response(ds.readable).arrayBuffer()); }
  return JSON.parse(new TextDecoder().decode(bytes));
}
async function shareLink(){ const u = new URL(location.href); u.hash = "s=" + await encodeState(); return u.toString(); }

function layout(dx){
  const st = $("#stage"); const n = variants().length;
  st.querySelectorAll(".cardw").forEach(el => {
    const k = +el.dataset.k, d = k - S.active, ad = Math.abs(d);
    el.style.transform = `translateX(${d*64}%) translateX(${dx||0}px) translateZ(${-ad*150}px) rotateY(${-d*34}deg) scale(${1-Math.min(ad,2)*.12})`;
    el.style.opacity = ad>2 ? 0 : 1; el.style.zIndex = 20-ad; el.style.pointerEvents = ad>2 ? "none" : "auto";
    el.classList.toggle("on", d===0); el.classList.toggle("flipped", d===0 && flipped);
  });
  $("#dots").querySelectorAll(".dot").forEach(dt => dt.classList.toggle("on", +dt.dataset.k===S.active));
  $("#prev").disabled = S.active===0; $("#next").disabled = S.active>=n-1;
  const v = cur(); $("#count").textContent = n ? `${S.active+1} of ${n} · ${v.b.brand} · ${v.c.name}` : "No bags yet";
}
function setActive(k){ const n = variants().length; if(k<0||k>=n) return; if(k!==S.active){ flipped=false; S.active=k; save(); } layout(0); renderPanel(); }
(() => {
  const st = $("#stage");
  st.addEventListener("pointerdown", e => { drag = {x:e.clientX, y:e.clientY, t:Date.now(), moved:false, id:e.pointerId}; st.classList.add("dragging"); });
  st.addEventListener("pointermove", e => { if(!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y; if(!drag.moved && Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)){ drag.moved = true; try{ st.setPointerCapture(drag.id); }catch(x){} } if(drag.moved){ e.preventDefault(); layout(Math.max(-160, Math.min(160, dx))); } });
  const end = e => { if(!drag) return; st.classList.remove("dragging"); const dx = (e.clientX||drag.x) - drag.x; const moved = drag.moved; const target = e.target.closest(".cardw"); drag = null;
    if(moved){ if(dx < -40) setActive(S.active+1); else if(dx > 40) setActive(S.active-1); else layout(0); return; }
    if(target){ const k = +target.dataset.k; if(k===S.active){ flipped = !flipped; layout(0); } else setActive(k); } };
  st.addEventListener("pointerup", end); st.addEventListener("pointercancel", () => { if(drag){ drag=null; st.classList.remove("dragging"); layout(0); } });
  $("#prev").addEventListener("click", () => setActive(S.active-1)); $("#next").addEventListener("click", () => setActive(S.active+1));
  $("#dots").addEventListener("click", e => { const d = e.target.closest(".dot"); if(d) setActive(+d.dataset.k); });
  document.addEventListener("keydown", e => { if(e.target.matches("input,textarea,select")) return; if(e.key==="ArrowRight") setActive(S.active+1); if(e.key==="ArrowLeft") setActive(S.active-1); });
})();

function rankText(){
  const L = ["Bag board ranking from " + (S.by||"someone")];
  S.order.forEach((vid,i) => { const v = byVid(vid); if(!v) return; L.push((i+1) + ". " + v.b.brand + " " + v.b.name + " in " + v.c.name + " (" + fmt(v.b.price) + ") — Tuesday: " + (S.tuesday[vid]||"–") + (S.notes[vid] ? " — " + S.notes[vid] : "")); });
  return L.join("\n");
}
async function sendRank(){
  const btn = $("#sendrank"), note = $("#sendnote"); btn.disabled = true; btn.textContent = "Sending…";
  const link = await shareLink();
  const payload = {_subject:"Bag board ranking: " + (S.by||"someone"), _template:"table", _captcha:"false", Name:S.by||"", Ranking:rankText(), "Lineup link":link};
  const ctl = new AbortController(); const timer = setTimeout(()=>ctl.abort(), 15000);
  let ok = false;
  try{ const res = await fetch(ENDPOINT, {method:"POST", headers:{"Content-Type":"application/json","Accept":"application/json"}, body:JSON.stringify(payload), signal:ctl.signal}); let j = {}; try{ j = await res.json(); }catch(e){} ok = res.ok && String(j.success)==="true"; }catch(e){}
  clearTimeout(timer); btn.disabled = false; btn.textContent = "Send ranking to Jon";
  if(ok){ note.textContent = "Sent to Jon."; toast("Sent to Jon"); }
  else { const mailto = "mailto:" + TO + "?subject=" + encodeURIComponent("Bag board ranking: " + (S.by||"")) + "&body=" + encodeURIComponent(rankText() + "\n\nLineup: " + link); note.innerHTML = `The automatic email did not go through. <a class="btn ghost small" href="${esc(mailto)}" style="margin-left:6px">Email it instead</a>`; }
}

// ---------- brief, modes, share ----------
function renderBrief(){ $("#brieftext").textContent = S.brief; $("#briefedit").value = S.brief; const editing = S.mode==="edit"; $("#brieftext").classList.toggle("hide", editing); $("#briefedit").classList.toggle("hide", !editing); }
$("#briefedit").addEventListener("input", e => { S.brief = e.target.value; $("#brieftext").textContent = S.brief; save(); });
function setMode(m){ S.mode = m; save(); $("#modes").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.mode===m)); $("#stagehint").textContent = m==="edit" ? "Swipe to the bag you want to change. The form below edits it." : m==="rank" ? "The order below is the ranking. Each color counts on its own." : "Swipe to turn the lineup. Tap the bag to flip it."; if(m==="edit") $("#brief").open = true; renderBrief(); renderPanel(); }
$("#modes").addEventListener("click", e => { const b = e.target.closest("[data-mode]"); if(b) setMode(b.dataset.mode); });
$("#copylink").addEventListener("click", async () => { const link = await shareLink(); try{ await navigator.clipboard.writeText(link); toast("Link copied. It carries this exact lineup."); }catch(e){ prompt("Copy this link:", link); } });

// ---------- boot ----------
async function boot(){
  let fromLink = null;
  const m = location.hash.match(/^#s=(.+)$/);
  if(m){ try{ fromLink = await decodeState(m[1]); }catch(e){ fromLink = null; } }
  if(fromLink){ Object.assign(S, {bags:fromLink.bags||S.bags, order:fromLink.order||[], tuesday:fromLink.tuesday||{}, notes:fromLink.notes||{}, brief:fromLink.brief||S.brief, by:fromLink.by||"", active:0, mode:"view"}); save(); }
  else { try{ const saved = JSON.parse(localStorage.getItem(LS)||"{}"); if(saved.v===2) Object.assign(S, saved); }catch(e){} }
  normalize(); renderBrief(); renderStage(); setMode(S.mode);
  if(fromLink) toast("Opened a shared lineup");
}
boot();
</script>
